[project]
name = "em-ebay-repricer"
version = "0.1.0"
description = "EveryMarket Ebay Spree repricing from cart, ads, and catalog sources"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "dateparser>=1.2",
  "google-cloud-storage>=2.14",
  "peewee>=3.17",
  "psycopg2-binary>=2.9",
  "pymysql>=1.1",
  "requests>=2.31",
  "urllib3<2",
]

[project.scripts]
em-ebay-repricer = "em_ebay_repricer.cli:reprice"
em-ebay-repricer-plan = "em_ebay_repricer.plan_cli:plan_prices"
em-ebay-repricer-apply = "em_ebay_repricer.apply_cli:apply_prices"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["em_ebay_repricer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
