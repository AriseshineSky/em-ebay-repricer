# Example config — copy to config.ini and fill in real values.
# NEVER commit config.ini (it is gitignored).

[pg_db]
host = 127.0.0.1
port = 5432
user = YOUR_PG_USER
password = YOUR_PG_PASSWORD
name = em-catalog
product_sources_table = product_sources

# Optional: use a full URL instead of host/user/password above
# url = postgresql://USER:PASSWORD@HOST:5432/em-catalog

[product_service]
host = 127.0.0.1
port = 9200
user = YOUR_ES_USER
password = YOUR_ES_PASSWORD

# Optional pricing rules (defaults used if omitted)
[price.rules.ebay_us]
roi = 0.3
ad_cost = 5
transfer_cost = 1
