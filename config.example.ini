# Example config — copy to ~/.em_ebay_repricer/config.ini (or ./config.ini).
# NEVER commit real credentials.

[pg_db]
host = 127.0.0.1
port = 5432
user = YOUR_PG_USER
password = YOUR_PG_PASSWORD
name = em-catalog
product_sources_table = product_sources
# url = postgresql://USER:PASSWORD@HOST:5432/em-catalog

[product_service]
host = 127.0.0.1
port = 9200
user = YOUR_ES_USER
password = YOUR_ES_PASSWORD

# Option A: direct Spree API credentials
[spree]
endpoint = https://your-store.example.com
api_key = YOUR_SPREE_API_KEY
api_version = v1

# Option B: look up store by -s store_code from MySQL (omit [spree] if using this)
# [store_db]
# host = 127.0.0.1
# user = YOUR_MYSQL_USER
# password = YOUR_MYSQL_PASSWORD
# name = everymarket

[price.rules.ebay_us]
roi = 0.3
ad_cost = 5
transfer_cost = 1

[ebay_repricer]
price_diff_threshold = 1.0
